    .insight-list li::before{content:counter(ins);position:absolute;left:0;width:24px;height:24px;background:#4f8ef7;color:#fff;border-radius:50%;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;top:10px}
